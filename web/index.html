<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RY 文档归档助手</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">RY 文档归档助手</span>
        <span class="brand-sub">Word → PDF → RAR</span>
      </div>
    </div>
    <nav class="steps" aria-label="归档流程">
      <span class="steps-title">归档流程</span>
      <ol id="steps"></ol>
    </nav>
    <div class="sidebar-spacer"></div>
    <div id="sidebar-input"></div>
    <button type="button" class="sidebar-log" data-action="toggle-log">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      运行日志 <span id="log-count" class="log-count"></span>
    </button>
  </aside>
  <main id="main" class="main"></main>
</div>

<div id="log-drawer" class="drawer" hidden>
  <div class="drawer-head">
    <span>运行日志</span>
    <button type="button" class="icon-btn" data-action="toggle-log" aria-label="关闭运行日志">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <ol id="log-list" class="log-list"></ol>
</div>

<div id="modal" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>
    <div id="modal-body" class="modal-body"></div>
    <div class="modal-actions">
      <button type="button" class="btn" data-action="modal-cancel">取消</button>
      <button type="button" class="btn primary" data-action="modal-ok" id="modal-ok">确认</button>
    </div>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
